<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="48" x2="56" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="48" x2="56" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.4)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Dashboard Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Shaded Area Under Trend Line -->
  <path d="M12 48 L22 36 L34 40 L46 22 L54 14 L54 50 L12 50 Z" fill="url(#glowGrad)" opacity="0.6" />

  <!-- Trend Analytics Upward Trajectory Line -->
  <path d="M12 48 L22 36 L34 40 L46 22 L54 14" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Trend Nodes -->
  <circle cx="22" cy="36" r="3" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="34" cy="40" r="3" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="46" cy="22" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="54" cy="14" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
</svg>
